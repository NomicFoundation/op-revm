# Vendored from https://github.com/ethereum-optimism/optimism `rust/op-revm`
# at commit b40d2ce097b928fe1a4ec79a8a1925eb231c675e (tag `op-reth/v2.4.0`).
#
# No op-revm release supports revm 40 (op-revm 20.0.0 on crates.io pins revm
# ^38), and depending on the monorepo via git pulls in over 1 GB of unrelated
# sources, so the crate is vendored instead. All files are verbatim copies
# except this manifest, whose `workspace = true` inheritances from the
# monorepo's workspace have been replaced by that workspace's concrete values.
[package]
name = "op-revm"
description = "Optimism variant of Revm"
version = "20.0.0"
authors = ["Op Stack Contributors"]
edition = "2024"
keywords = ["ethereum", "optimism", "crypto"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethereum-optimism/optimism"
rust-version = "1.94"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# revm
revm = { version = "40.0.3", default-features = false }
auto_impl = "1.3.0"

# Optional
serde = { version = "1.0.228", default-features = false, features = [
	"derive",
	"rc",
], optional = true }

[dev-dependencies]
rstest = "0.26.1"
alloy-sol-types = { version = "1.6.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = [
	"alloc",
	"preserve_order",
] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
alloy-primitives = { version = "1.6.0", default-features = false }

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst"]
std = [
	"serde?/std",
	"revm/std",
	"alloy-sol-types/std",
	"sha2/std",
	"serde_json/std",
	"alloy-primitives/std",
]
serde = ["dep:serde", "revm/serde", "alloy-primitives/serde"]
portable = ["revm/portable"]

dev = [
	"revm/dev",
	"memory_limit",
	"optional_balance_check",
	"optional_block_gas_limit",
	"optional_eip3541",
	"optional_eip3607",
	"optional_no_base_fee",
]
memory_limit = ["revm/memory_limit"]
optional_balance_check = ["revm/optional_balance_check"]
optional_block_gas_limit = ["revm/optional_block_gas_limit"]
optional_eip3541 = ["revm/optional_eip3541"]
optional_eip3607 = ["revm/optional_eip3607"]
optional_no_base_fee = ["revm/optional_no_base_fee"]
optional_fee_charge = ["revm/optional_fee_charge"]

# See comments in `revm-precompile`
secp256k1 = ["revm/secp256k1"]
c-kzg = ["revm/c-kzg"]
blst = ["revm/blst"]
bn = ["revm/bn"]
